name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci
      - run: npm run setup:py
      - run: npm run build
      - run: npm run test:node
      - run: npm run test:py

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/chorus-core/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package version $PKG"
            exit 1
          fi

      - name: Release preflight
        run: node scripts/release/check.mjs

      # npm provenance attests that a tarball was built from a specific commit,
      # and the attestation is only verifiable if that commit is publicly
      # readable — so npm refuses to generate it from a private repository.
      # This repo is private by choice, so provenance is decided here rather
      # than hard-coded: publishing must not fail over it, and if the repo is
      # ever made public the attestation comes back with no edit needed.
      - name: Decide on provenance
        id: prov
        run: |
          VIS=$(gh repo view "$GITHUB_REPOSITORY" --json visibility -q .visibility)
          if [ "$VIS" = "PUBLIC" ]; then
            echo "flag=--provenance" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "::notice::repository is $VIS, so publishing without provenance"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # An empty NPM_TOKEN secret fails as ENEEDAUTH *after* the tarballs are
      # built, which reads like a broken build rather than a missing secret.
      # `gh secret set` with no stdin stores an empty string silently, so this
      # is a state a release can genuinely be in.
      - name: Check the npm token is present
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is unset or empty. Set it with a value:"
            echo "::error::  gh secret set NPM_TOKEN < token.txt   (then delete the file)"
            exit 1
          fi
          echo "npm token present (${#NODE_AUTH_TOKEN} characters)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Names are checked against the registry before anything is uploaded. A
      # name taken by someone else fails as a 403 partway through the loop,
      # which means a half-published release that cannot be undone.
      - name: Check the package names are publishable
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        run: node scripts/release/names.mjs --whoami "$(npm whoami)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Order matters: dependents must not publish before their dependencies,
      # or an install between the two publishes resolves nothing.
      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        run: |
          for p in chorus-core chorus-web chorus-captions chorus-mcp; do
            echo "publishing $p"
            npm publish --workspace "$p" ${{ steps.prov.outputs.flag }} --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          for p in chorus-core chorus-web chorus-captions chorus-mcp; do
            npm publish --workspace "$p" --dry-run --access public
          done
