name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # analyze/scene shell out to ffmpeg; the pipeline tests decode audio.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci
      - run: npm run setup:py
      - run: npm run build
      - run: npm run test:node
      - run: npm run test:py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Catches placeholder metadata, missing LICENSE/README, dead bin links,
      # and source leaking into the tarball — all things that are permanent
      # once published.
      - run: node scripts/release/check.mjs
