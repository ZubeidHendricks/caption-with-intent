name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # analyze/scene shell out to ffmpeg; the pipeline tests decode audio.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci

      # The renderer tests run in a real browser: the spec's geometry is all
      # resolved layout, and a DOM emulator would report plausible zeros and
      # pass while the renderer was broken.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run setup:py
      - run: npm run build
      - run: npm run test:node
      - run: npm run test:py

      # Hold the reference renderer to the same render-conformance bar every
      # third-party implementation is held to. Node 18 has no playwright, so
      # this rides with the versions that do.
      - name: Render conformance
        if: matrix.node != '18'
        run: npm run test:render

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Catches placeholder metadata, missing LICENSE/README, dead bin links,
      # and source leaking into the tarball — all things that are permanent
      # once published.
      - run: node scripts/release/check.mjs
